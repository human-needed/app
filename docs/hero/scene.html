<!doctype html>

<!-- README hero scene (docs/hero/make.py renders it frame by frame). #t=<ms> picks the moment:
     an agent works, needs you (orange glow, chime), works again, is done (green), all quiet. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../app/ui/tokens.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111315; }
  body { font: 14px/1.5 var(--hn-font); color: var(--hn-text); }
  .desk { position: absolute; inset: 0; background: radial-gradient(120% 90% at 30% 10%, #23272c 0%, #15171a 60%, #0f1012 100%); }
  .brand { position: absolute; left: 44px; top: 34px; display: flex; align-items: center; gap: 10px; font: 500 17px var(--hn-font-mono); letter-spacing: .14em; }
  .brand svg { width: 18px; height: 18px; color: #fff; }
  .term { position: absolute; left: 44px; top: 86px; width: 470px; height: 330px; border-radius: 10px; background: #0c0d0f; border: 1px solid #2b2f34; box-shadow: 0 18px 50px rgba(0,0,0,.5); overflow: hidden; }
  .term .bar { height: 30px; border-bottom: 1px solid #23262a; display: flex; align-items: center; gap: 7px; padding: 0 12px; }
  .term .bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a3e43; }
  .term pre { margin: 0; padding: 16px 18px; font: 13px/1.75 var(--hn-font-mono); color: #cfd3d8; white-space: pre-wrap; }
  .term b { color: #fff; font-weight: 500; }
  .dim { color: #7d848c; } .ok { color: #8fd19e; } .warn { color: #ffb35c; } .blue { color: #7aa2ff; }
  .pitch { position: absolute; left: 44px; bottom: 30px; font-size: 15px; color: #aab0b7; }
  .pitch b { color: #fff; font-weight: 600; }
  .chip { position: absolute; left: 44px; top: 430px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #cfd3d8; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  iframe { position: absolute; right: 44px; top: 62px; width: 340px; height: 400px; border: 0; border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.55); background: transparent; }
  /* The glow, as app/ui/glow.css: a coloured layer masked to the edges. */
  #glow { position: absolute; inset: 0; pointer-events: none; opacity: 0; --t: 26px;
    -webkit-mask-image: linear-gradient(to bottom, #000, transparent var(--t)), linear-gradient(to top, #000, transparent var(--t)), linear-gradient(to right, #000, transparent var(--t)), linear-gradient(to left, #000, transparent var(--t));
    mask-image: linear-gradient(to bottom, #000, transparent var(--t)), linear-gradient(to top, #000, transparent var(--t)), linear-gradient(to right, #000, transparent var(--t)), linear-gradient(to left, #000, transparent var(--t)); }
  #glow div { position: absolute; inset: 0; background: var(--c); }
</style>
</head>
<body>
<div class="desk"></div>
<div class="brand"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="3.4" stroke-dasharray="4.983 1.3" stroke-dashoffset="-0.65" transform="rotate(-90 12 12)"/></svg>HUMAN_NEEDED</div>
<div class="term"><div class="bar"><i></i><i></i><i></i></div><pre id="out"></pre></div>
<div class="chip" id="chip"><i></i><span></span></div>
<div class="pitch"><b>Know when your AI agent needs you,</b> without watching it.</div>
<iframe id="panel" title="HumanNeeded panel"></iframe>
<div id="glow"><div></div></div>
<script>
  // Timeline (ms). Loop: 0..LOOP.
  const LOOP = 8000;
  const T = [
    [0, 'working'], [2000, 'needs'], [4600, 'working'], [5600, 'done'], [7300, 'idle'],
  ];
  const COLOR = { needs: '#ffa62b', done: '#22e04a', working: '#3366ff', idle: '#ffd2a0' };
  const NAME = { needs: 'Needs you', done: 'Done', working: 'Working', idle: 'Idle' };
  const t = Math.max(0, Math.min(LOOP - 1, Number((location.hash.match(/t=(\d+)/) || [])[1] || 2600)));
  let state = 'working'; let since = 0;
  for (const [at, s] of T) if (t >= at) { state = s; since = at; }
  const start = { working: 'claude › refactor the payment module\n<span class="ok">✓</span> read 14 files\n<span class="ok">✓</span> updated src/payments/charge.rs\n' };
  const lines = {
    working: start.working + (t < 4600 ? '<span class="blue">●</span> <span class="dim">thinking…</span>' : '<span class="ok">✓</span> pushed refactor-payments\n<span class="blue">●</span> <span class="dim">running cargo test…</span>'),
    needs: start.working + '\n<span class="warn">● Claude needs your permission to run:</span>\n  <b>git push origin refactor-payments</b>\n\n  <b>1. Yes</b>   2. No, tell Claude what to do',
    done: start.working + '<span class="ok">✓</span> pushed refactor-payments\n<span class="ok">✓</span> ran cargo test (212 passed)\n\n<span class="ok">● Done</span> <span class="dim">in 2m 14s</span>',
  };
  lines.idle = lines.done;
  document.getElementById('out').innerHTML = lines[state];
  const chip = document.getElementById('chip');
  chip.style.setProperty('--c', COLOR[state]);
  chip.lastElementChild.textContent = state === 'needs' ? 'Needs you: the edges glow and a chime plays' : state === 'done' ? 'Done: a green glow and a short chime' : state === 'idle' ? 'All quiet' : 'Working';

  // Glow level: Breathe (100% → 35% → 100% each second), 250 ms fades (app/ui/glow.css).
  function level(s, el) {
    if (s !== 'needs' && s !== 'done') return 0;
    const fade = 250;
    const breathe = el <= fade ? 1 : 0.35 + 0.65 * (0.5 + 0.5 * Math.cos(2 * Math.PI * ((el - fade) % 1000) / 1000));
    return Math.min(1, el / fade) * breathe;
  }
  let a = level(state, t - since);
  let color = COLOR[state];
  // The fade-out after a glowing state (the one before this, for 250 ms).
  const prev = T.filter(([at]) => at <= since).slice(-2, -1)[0];
  if (prev && t - since < 250 && (prev[1] === 'needs' || prev[1] === 'done') && a === 0) {
    a = (1 - (t - since) / 250) * level(prev[1], since - prev[0]); color = COLOR[prev[1]];
  }
  const g = document.getElementById('glow');
  g.style.opacity = a.toFixed(3);
  g.firstElementChild.style.setProperty('--c', color);

  document.getElementById('panel').src = `panel.html#${state}`;
</script>
</body>
</html>

[package]
name = "hn-engine"
description = "HumanNeeded app engine: IPC server, puck link, session merge, firmware update, integrations"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hnd"
path = "src/bin/hnd.rs"

[dependencies]
hn-core.workspace = true
hn-sim.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-serial = "5.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
dirs = "5"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp"] }
winreg = "0.52"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

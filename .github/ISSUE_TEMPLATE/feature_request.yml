name: Feature request
description: An idea to make HumanNeeded better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: else
    attributes:
      label: Anything else?
      description: Other tools that do this well, screenshots, sketches.

name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Security problems go to SECURITY.md instead, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Claude Code session
        2. …
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → App shows it.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS (Apple silicon), macOS (Intel), Other]
    validations:
      required: true
  - type: checkboxes
    id: agents
    attributes:
      label: Agents involved
      options:
        - label: Claude Code
        - label: Cowork / Claude on the web (cloud link)
        - label: Codex
        - label: Cursor
  - type: dropdown
    id: puck
    attributes:
      label: Puck
      options: [No puck, Puck connected]
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In the app, open Settings → Advanced → Copy diagnostics, then paste here. It has the versions, agents, Puck and the last log lines, without keys or session ids. Check it for anything private first.
      render: text
  - type: textarea
    id: log
    attributes:
      label: More log (optional)
      description: Settings → Advanced → Open log. Paste the lines around the problem if they aren't in the diagnostics.
      render: text

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux deps (Tauri, serial, audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Unit + integration tests: HTTP hub -> engine -> puck simulator.
      - run: cargo test --workspace
      # Launch the app itself and check it starts (the main thread runs, the hub answers).
      # Linux runners have no desktop session for the tray, so Windows and macOS only.
      - name: Startup smoke run
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cargo build -p humanneeded
          scripts/smoke.sh target/debug/humanneeded

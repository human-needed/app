# Per-OS `hn` binaries for agent plugins to bundle (D-046). Runs on demand and on `hn-v*` tags;
# artifacts: dist/hn/<target>/hn[.exe] + hn-build.json (version, contract, sha256).
name: hn binaries
on:
  workflow_dispatch:
  push:
    tags: ["hn-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, targets: "x86_64-pc-windows-msvc aarch64-pc-windows-msvc" }
          - { os: macos-latest, targets: "aarch64-apple-darwin x86_64-apple-darwin" }
          - { os: ubuntu-latest, targets: "x86_64-unknown-linux-musl aarch64-unknown-linux-musl", cross: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add targets
        shell: bash
        run: for t in ${{ matrix.targets }}; do rustup target add $t; done
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then export CARGO=cross; fi
          sh scripts/build-hn.sh ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: hn-${{ matrix.os }}
          path: dist/hn

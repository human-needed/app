# Test builds (unsigned, D-039): Windows NSIS installer and macOS universal .dmg.
# A `v*` tag (e.g. v0.9.0-beta.1) builds both and publishes a GitHub release marked "latest"
# (the website links to releases/latest/download/<stable name>) with SHA-256 checksums. Run by hand (workflow_dispatch) it only builds them and keeps them as run artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TAURI_CLI: "@tauri-apps/cli@2.12.4" # matches the tauri crate (2.12.x)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --bundles nsis
            rust_targets: ""
            out: target/release/bundle/nsis/*.exe
            stable: HumanNeeded-windows-x64-setup.exe
          - os: macos-latest
            name: macos
            args: --target universal-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            out: target/universal-apple-darwin/release/bundle/dmg/*.dmg
            stable: HumanNeeded-macos-universal.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="v$(node -p "require('./app/tauri.conf.json').version")"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but app/tauri.conf.json says $want"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build installer
        working-directory: app
        shell: bash
        run: npx --yes "$TAURI_CLI" build ${{ matrix.args }}
      - name: Collect
        shell: bash
        run: |
          mkdir dist
          cp ${{ matrix.out }} dist/
          # Same file under a version-free name, so the website can link to
          # releases/latest/download/<stable name> and never needs editing.
          cp ${{ matrix.out }} "dist/${{ matrix.stable }}"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --latest \
            --title "HumanNeeded $GITHUB_REF_NAME (test build)" \
            --notes "Unsigned test build. Windows: run the setup .exe. macOS (Apple silicon and Intel): open the .dmg. See 'Test builds' in the README for the SmartScreen / Gatekeeper steps. Check downloads against SHA256SUMS.txt."

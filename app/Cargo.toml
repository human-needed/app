[package]
name = "humanneeded"
description = "HumanNeeded tray app: owns the puck, merges agent sessions, settings and firmware updates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "humanneeded"

[[bin]]
name = "humanneeded"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hn-core.workspace = true
hn-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
cpal = "0.18"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

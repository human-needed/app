<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HumanNeeded</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc;
    --accent: #3366ff; --accent-text: #ffffff; --warn-bg: #fff4e0; --warn-text: #7a4b00;
    --ok: #1f8a3d; --err: #c62828; --tip-bg: #1d1d1b; --tip-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --card: #1c1c1c; --text: #eceae4; --muted: #9a978f; --line: #2e2e2c;
      --accent: #5b84ff; --accent-text: #ffffff; --warn-bg: #3a2a0c; --warn-text: #ffcf7a;
      --ok: #5fd27e; --err: #ff6b6b; --tip-bg: #eceae4; --tip-text: #121212;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .card-desc { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--line); }
  .note { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 6px 13px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: default; }
  .ok { color: var(--ok); } .err { color: var(--err); } .muted { color: var(--muted); }
  .field { display: grid; grid-template-columns: 170px 1fr; align-items: center; gap: 12px; padding: 7px 0; }
  .field + .field { border-top: 1px solid var(--line); }
  .field > span.label { color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .control { display: flex; align-items: center; gap: 10px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .value { min-width: 44px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px; min-width: 200px; }
  input[type=color] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
  .hex { color: var(--muted); font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .tip { position: relative; width: 18px; height: 18px; padding: 0; border-radius: 50%;
    font-size: 12px; line-height: 16px; text-align: center; color: var(--muted); flex: none; }
  .tip:hover::after, .tip:focus::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 8px);
    transform: translateX(-50%); width: 260px; padding: 8px 10px; border-radius: 8px; background: var(--tip-bg);
    color: var(--tip-text); font-size: 13px; line-height: 1.4; text-align: left; white-space: normal; pointer-events: none; z-index: 10; }
  #saved { color: var(--ok); font-size: 13px; opacity: 0; transition: opacity .3s; }
  #saved.show { opacity: 1; }
  .hidden { display: none !important; }
  .light { width: 46px; height: 46px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--line) inset; }
  .list { list-style: none; margin: 6px 0 0; padding: 0; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
  .pill { font-size: 12px; border-radius: 99px; padding: 1px 9px; border: 1px solid var(--line); color: var(--muted); }
  .pill.needs { background: #ff8800; color: #fff; border-color: #ff8800; }
  .pill.working { background: #3366ff; color: #fff; border-color: #3366ff; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  @media (max-width: 560px) { .field { grid-template-columns: 1fr; gap: 4px; } select { min-width: 0; width: 100%; } }
</style>
</head>
<body>
<main>
  <h1>HumanNeeded</h1>
  <p class="sub">Your puck lights up when an agent is working, done, or needs you.</p>

  <section class="card">
    <div class="row">
      <div id="light" class="light"></div>
      <div class="grow">
        <h2 id="puck-title">Looking for your puck…</h2>
        <div id="puck-detail" class="muted"></div>
      </div>
      <button id="test" type="button">Test light</button>
      <select id="mute" aria-label="Mute sounds">
        <option value="">Sounds on</option>
        <option value="30">Mute 30 minutes</option>
        <option value="60">Mute 1 hour</option>
        <option value="240">Mute 4 hours</option>
        <option value="on">Mute until turned on</option>
      </select>
    </div>
    <div id="fw-note" class="note hidden" style="margin:14px 0 0"></div>
    <div id="http-note" class="note hidden" style="margin:14px 0 0"></div>
    <ul id="sessions" class="list"></ul>
  </section>

  <section class="card">
    <div class="card-head"><h2 class="grow">Agents</h2></div>
    <p class="card-desc">HumanNeeded needs a small integration in each agent app.</p>
    <ul id="agents" class="list"></ul>
  </section>

  <div id="settings" class="hidden">
    <div class="row" style="margin: 0 4px 8px"><h2 class="grow">Light and sound</h2><span id="saved">Saved</span></div>
    <div id="groups"></div>
  </div>

  <section class="card">
    <div class="card-head"><h2 class="grow">Puck</h2></div>
    <p class="card-desc" id="device">Not connected.</p>
    <p class="card-desc" id="update-note"></p>
    <div class="row">
      <button id="fw-check" type="button">Check for firmware update</button>
      <button id="fw-update" type="button" class="primary hidden">Update firmware</button>
      <span class="grow"></span>
      <button id="restart" type="button">Restart puck</button>
      <button id="reset" type="button">Reset settings</button>
    </div>
  </section>

  <section class="card">
    <div class="card-head"><h2 class="grow">App</h2></div>
    <div class="row">
      <label class="grow"><input type="checkbox" id="autostart"> Start HumanNeeded when I sign in</label>
      <button id="clear" type="button">Clear the light</button>
      <button id="log" type="button">Open log</button>
    </div>
    <p class="card-desc" id="app-version" style="margin-top:8px"></p>
    <details class="card-desc"><summary>Details</summary><p id="http-info" class="mono"></p><p id="hn-info" class="mono"></p></details>
  </section>
  <p id="error" class="err"></p>
</main>
<script src="app.js"></script>
</body>
</html>

[workspace]
resolver = "2"
members = ["crates/core", "crates/sim", "crates/engine", "crates/cli", "app"]

[workspace.package]
version = "0.9.0-beta.6"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/human-needed/app"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hn-core = { path = "crates/core" }
hn-sim = { path = "crates/sim" }
hn-engine = { path = "crates/engine" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

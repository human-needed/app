[workspace]
resolver = "2"
members = ["crates/core", "crates/sim", "crates/engine", "crates/cli", "app"]

[workspace.package]
version = "0.10.1"
edition = "2021"
license = "FSL-1.1-ALv2"
repository = "https://github.com/human-needed/app"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hn-core = { path = "crates/core" }
hn-sim = { path = "crates/sim" }
hn-engine = { path = "crates/engine" }

[profile.release]
opt-level = "s"
# No LTO, parallel codegen: with the dependencies cached, a release build is mostly our own
# crates plus the link, and LTO was most of that (locally 27 s -> 18 s). The app is 7% larger
# (14.2 MB vs 13.3 MB); a tray app doesn't need the extra speed.
lto = false
strip = true
